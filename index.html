<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var M={"kdp-book-manager-v2":"epub-book-manager-v2","kdp-book-manager-suggestions":"epub-book-manager-suggestions","kdp-prompt-steps-v1":"epub-prompt-steps-v1","kdp-templates-v1":"epub-templates-v1","kdp-theme":"epub-theme","kdp-archived-open":"epub-archived-open"};try{for(var o in M){var v=localStorage.getItem(o);if(v!==null){if(localStorage.getItem(M[o])===null)localStorage.setItem(M[o],v);localStorage.removeItem(o)}}}catch(e){}var p=localStorage.getItem("epub-theme")||"system";var d=p==="system"?matchMedia("(prefers-color-scheme: dark)").matches:p==="dark";document.documentElement.dataset.theme=d?"dark":"light"})();</script>
<meta name="description" content="Local-first manager for ePub books with an AI-assisted workflow. Installable and works offline.">
<meta name="theme-color" content="#0a84ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ePub Books">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ePub Book Manager</title><link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <button id="newBookBtn" class="primary full">＋ New book</button>
  <div class="side-section"><label>Books</label><div class="search-wrap"><input id="searchInput" placeholder="Search books…"><button id="searchClear" class="search-clear" title="Clear search" aria-label="Clear search">×</button></div></div>
  <div class="side-section"><label>Status</label><select id="statusFilter"></select></div>
  <div id="bookList" class="book-list"></div>
  <div class="sidebar-bottom">
    <div class="menu-wrap">
      <button id="menuBtn" class="secondary full">☰ Menu</button>
      <div id="appMenu" class="app-menu hidden">
        <button class="menu-item" id="exportAllBtn">Export books</button>
        <button class="menu-item" id="importBtn">Import books</button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="promptsBtn">Configure prompts</button>
        <button class="menu-item" id="templatesBtn">Configure templates</button>
        <button class="menu-item" id="backupBtn">Backup</button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="installBtn">Install app</button>
        <div class="menu-sep"></div>
        <div class="menu-caption">Appearance</div>
        <div class="segmented">
          <button data-theme-choice="light">Day</button>
          <button data-theme-choice="dark">Night</button>
          <button data-theme-choice="system">System</button>
        </div>
      </div>
      <input id="importInput" type="file" accept=".txt,.md,.zip" multiple hidden>
    </div>
  </div>
</aside>

<main class="main">
<section id="emptyState" class="empty hidden"><h2>No book selected</h2><p>Create a book to start the workflow.</p><button id="emptyNewBtn" class="primary">Create first book</button></section>

<section id="editor" class="hidden">
  <div class="sticky-top">
  <div class="book-header">
    <div class="title-wrap"><input id="titleInput" class="title-input" placeholder="Book title"></div>
    <div class="status-actions">
      <select id="statusInput"></select>
      <div class="top-actions"><button id="saveBtn" class="primary">Save</button><button id="exportBookBtn" class="icon-only" title="Export this book" aria-label="Export this book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button><button id="deleteBtn" class="icon-only danger-icon" title="Delete book" aria-label="Delete book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button></div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="workflow">Workflow</button>
    <button class="tab" data-tab="publishing">Publishing</button>
    <button class="tab" data-tab="chapters">Chapters</button>
    <button class="tab" data-tab="build">Build</button>
  </nav>
  </div>
  <div class="meta-grid">
    <div class="field">
      <label for="authorInput">Author</label>
      <div class="combo"><input id="authorInput" autocomplete="off" placeholder="Type or choose an author"><div id="authorSuggest" class="suggest hidden"></div></div>
    </div>
    <div class="field">
      <label for="nicheInput">Niche</label>
      <div class="combo"><input id="nicheInput" autocomplete="off" placeholder="Type or choose a niche"><div id="nicheSuggest" class="suggest hidden"></div></div>
    </div>
    <div class="field">
      <label for="typeInput">Type</label>
      <div class="combo"><input id="typeInput" autocomplete="off" placeholder="Type or choose a type"><div id="typeSuggest" class="suggest hidden"></div></div>
    </div>
    <label>Price<div class="price-wrap"><span>$</span><input id="priceInput" type="number" step="0.01" min="0" placeholder="0.00"></div></label>
    <div class="field">
      <label for="languageInput">Language</label>
      <div class="combo"><input id="languageInput" autocomplete="off" placeholder="en-US"><div id="languageSuggest" class="suggest hidden"></div></div>
    </div>
    <label>Target reader<input id="readerInput"></label>
    <label id="archiveField" class="archive-field hidden">Archive reason<input id="archiveReasonInput" placeholder="Why is this book archived?"></label>
  </div>

  <section id="workflowTab"></section>
  <section id="publishingTab" class="hidden"></section>
  <section id="chaptersTab" class="hidden"></section>
  <section id="buildTab" class="hidden"></section>
</section>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card">
  <div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.error("SW:",e)))}</script>

</body></html>
